<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var fetchHandler = function() {
            var target = (typeof origFetch === 'function') ? origFetch : window.fetch;
            return target.apply(window, arguments);
          };
          var descriptor = {
            get: function() {
              return fetchHandler;
            },
            set: function(val) {
              fetchHandler = val;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              Object.defineProperty(proto, 'fetch', descriptor);
            }
          }
        } catch (err) {
          console.warn('Fetch descriptor initialization handled:', err);
        }
      })();
    </script>
